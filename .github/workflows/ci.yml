name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl, dom, mbstring, pdo_sqlite, sqlite3, xml, xmlwriter
          coverage: none
      - run: composer validate --strict
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: touch database/database.sqlite
      - run: php artisan migrate:fresh --seed --force
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: php artisan test --compact
      - run: php artisan route:list --except-vendor > /dev/null
      - run: php artisan view:cache
      - run: vendor/bin/pint --test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl, dom, mbstring, pdo_sqlite, sqlite3, xml, xmlwriter
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [php, frontend]
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Smoke-test seeded demo
        run: |
          docker compose up -d --wait --wait-timeout 120
          curl --fail http://localhost:8000/up
          curl --fail http://localhost:8000/login
          docker compose exec -T app php artisan route:list --except-vendor
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test containers
        if: always()
        run: docker compose down -v

  render-demo:
    runs-on: ubuntu-latest
    needs: [php, frontend]
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f docker/Render.Dockerfile -t that-car-app-render .
      - name: Verify Apache demo startup and access restrictions
        run: |
          docker run -d --name render-demo -p 10000:10000 \
            -e APP_ENV=production -e APP_DEBUG=false -e PORTFOLIO_DEMO=true \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/data/database.sqlite \
            -e RUN_MIGRATIONS=true -e SEED_DEMO=true \
            -e SESSION_DRIVER=database -e CACHE_STORE=database \
            -e QUEUE_CONNECTION=sync -e MAIL_MAILER=log \
            -e VEHICLE_DATA_DRIVER=demo that-car-app-render
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:10000/up
          curl --fail http://localhost:10000/login | tee /tmp/demo-login.html
          python3 -c 'from pathlib import Path; assert "Portfolio demo" in Path("/tmp/demo-login.html").read_text()'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/admin)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/.env)" = 404
      - name: Show Apache demo logs
        if: failure()
        run: docker logs render-demo
      - name: Stop Apache demo
        if: always()
        run: docker rm -f render-demo
