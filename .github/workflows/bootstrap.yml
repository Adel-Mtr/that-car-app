name: Validate recovered source

on:
  workflow_dispatch:
  push:
    branches:
      - repair-source-bundle

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore recovered source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/part-00 \
            .bootstrap/part-01 \
            .bootstrap/part-02 \
            .bootstrap/fix-03-0 \
            .bootstrap/fix-03-1 \
            .bootstrap/fix-03-2 \
            .bootstrap/part-04 \
            .bootstrap/part-05 \
            .bootstrap/part-06 \
            .bootstrap/part-07 \
            .bootstrap/fix-08-0 \
            .bootstrap/fix-08-1 \
            .bootstrap/fix-08-2 \
            .bootstrap/fix-09-0 \
            .bootstrap/fix-09-1 \
            .bootstrap/fix-09-2 \
            | base64 --decode > /tmp/that-car-app.tar.xz
          xz -t /tmp/that-car-app.tar.xz
          tar -tJf /tmp/that-car-app.tar.xz > /dev/null
          tar -xJf /tmp/that-car-app.tar.xz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml

          # Laravel requires these writable runtime paths after a fresh clone.
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views
          printf '*\n!.gitignore\n' > storage/framework/cache/data/.gitignore
          printf '*\n!.gitignore\n' > storage/framework/sessions/.gitignore
          printf '*\n!.gitignore\n' > storage/framework/views/.gitignore

          # Tailwind v4 scans both application Blade files and Laravel pagination
          # templates. Use the complete Docker context and Composer vendor tree in
          # the frontend stage so every declared source is present during Vite.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Dockerfile')
          text = path.read_text()
          old = '''FROM node:22-bookworm-slim AS frontend-assets
          WORKDIR /app
          COPY package.json package-lock.json ./
          RUN npm ci --no-audit --no-fund
          COPY vite.config.js ./
          COPY resources ./resources
          RUN mkdir -p public storage/framework/views vendor/laravel/framework/src/Illuminate/Pagination/resources/views
          COPY --from=php-dependencies /app/vendor/laravel/framework/src/Illuminate/Pagination/resources/views ./vendor/laravel/framework/src/Illuminate/Pagination/resources/views
          RUN npm run build'''
          new = '''FROM node:22-bookworm-slim AS frontend-assets
          WORKDIR /app
          COPY package.json package-lock.json ./
          RUN npm ci --no-audit --no-fund
          COPY . .
          COPY --from=php-dependencies /app/vendor ./vendor
          RUN mkdir -p public storage/framework/views
          RUN test -f resources/views/auth/reset-password.blade.php
          RUN npm run build'''
          if old not in text:
              raise SystemExit('Expected Docker frontend-assets stage not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite
          coverage: none

      - name: Normalize PHP 8.3 dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer config platform.php 8.3.0
          composer update --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run PHPUnit
        run: php artisan test --compact

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Validate routes
        run: php artisan route:list --except-vendor > /dev/null

      - name: Validate Blade views
        run: |
          php artisan view:cache
          php artisan view:clear

      - name: Validate containers
        run: |
          docker compose config --quiet
          docker compose build

      - name: Publish validated source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish validated That Car App source"
          git push --force origin HEAD:source-ready
