name: Validate recovered source

on:
  workflow_dispatch:
  push:
    branches:
      - repair-source-bundle

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore recovered source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/part-00 \
            .bootstrap/part-01 \
            .bootstrap/part-02 \
            .bootstrap/fix-03-0 \
            .bootstrap/fix-03-1 \
            .bootstrap/fix-03-2 \
            .bootstrap/part-04 \
            .bootstrap/part-05 \
            .bootstrap/part-06 \
            .bootstrap/part-07 \
            .bootstrap/fix-08-0 \
            .bootstrap/fix-08-1 \
            .bootstrap/fix-08-2 \
            .bootstrap/fix-09-0 \
            .bootstrap/fix-09-1 \
            .bootstrap/fix-09-2 \
            | base64 --decode > /tmp/that-car-app.tar.xz
          xz -t /tmp/that-car-app.tar.xz
          tar -tJf /tmp/that-car-app.tar.xz > /dev/null
          tar -xJf /tmp/that-car-app.tar.xz -C .
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite
          coverage: none

      - name: Normalize PHP 8.3 dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer config platform.php 8.3.0
          composer update --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force

      - name: Run PHP tests and formatting checks
        shell: bash
        run: |
          php artisan test
          vendor/bin/pint --test
          php artisan route:list > /dev/null
          php artisan view:cache
          php artisan view:clear

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Validate containers
        run: |
          docker compose config --quiet
          docker compose build

      - name: Publish validated source branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish validated That Car App source"
          git push --force origin HEAD:source-ready
